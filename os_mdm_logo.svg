<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80">
  <!-- Background: transparent (matches page bg) -->
  
  <!-- Icon: rounded square with DB/data stacked layers icon -->
  <g transform="translate(0, 4)">
    <!-- Outer rounded square -->
    <rect x="2" y="2" width="68" height="68" rx="14" ry="14"
          fill="none" stroke="#1B5EA6" stroke-width="4"/>
    <!-- Top bar (like browser chrome) -->
    <line x1="2" y1="21" x2="70" y2="21" stroke="#1B5EA6" stroke-width="3.5"/>
    <!-- Two dots -->
    <circle cx="14" cy="13" r="3" fill="#1B5EA6"/>
    <circle cx="24" cy="13" r="3" fill="#1B5EA6"/>
    
    <!-- Data layers / MDM icon inside -->
    <!-- Layer 1 (top ellipse) -->
    <ellipse cx="36" cy="33" rx="16" ry="5.5" fill="none" stroke="#1B5EA6" stroke-width="3"/>
    <!-- Layer 2 (middle) -->
    <ellipse cx="36" cy="43" rx="16" ry="5.5" fill="none" stroke="#1B5EA6" stroke-width="3"/>
    <!-- Left side lines connecting layers -->
    <line x1="20" y1="33" x2="20" y2="43" stroke="#1B5EA6" stroke-width="3"/>
    <!-- Right side lines connecting layers -->
    <line x1="52" y1="33" x2="52" y2="43" stroke="#1B5EA6" stroke-width="3"/>
    <!-- Layer 3 (bottom) -->
    <ellipse cx="36" cy="53" rx="16" ry="5.5" fill="none" stroke="#1B5EA6" stroke-width="3"/>
    <line x1="20" y1="43" x2="20" y2="53" stroke="#1B5EA6" stroke-width="3"/>
    <line x1="52" y1="43" x2="52" y2="53" stroke="#1B5EA6" stroke-width="3"/>
  </g>

  <!-- Text: O.S -->
  <text x="88" y="46" 
        font-family="'Segoe UI', system-ui, sans-serif"
        font-weight="800"
        font-size="36"
        fill="#1B5EA6"
        letter-spacing="-1">O.S</text>
  
  <!-- Text: MDM -->
  <text x="88" y="66"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-weight="400"
        font-size="17"
        fill="#1B5EA6"
        letter-spacing="3">MDM</text>

  <!-- Vertical separator line -->
  <line x1="162" y1="30" x2="162" y2="68" stroke="#1B5EA6" stroke-width="1.5" opacity="0.4"/>

  <!-- Right text: software development -->
  <text x="170" y="47"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-weight="400"
        font-size="10"
        fill="#1B5EA6"
        opacity="0.8">master data</text>
  <text x="170" y="62"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-weight="600"
        font-size="10"
        fill="#1B5EA6"
        opacity="0.8">management</text>
</svg>